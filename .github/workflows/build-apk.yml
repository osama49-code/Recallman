name: Build RecallMan APK

on:
  push:
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - icon-*.png
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets exist
        env:
          A: ${{ secrets.KEYSTORE_BASE64 }}
          B: ${{ secrets.KEYSTORE_PASSWORD }}
          C: ${{ secrets.KEY_ALIAS }}
          D: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in A B C D; do
            if [ -z "${!v}" ]; then echo "::error::Missing one of the 4 signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"; exit 1; fi
          done

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (bundle PDF/Word libraries for offline use)
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          P=https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174
          M=https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0
          if curl -fsSL "$P/pdf.min.js" -o www/lib/pdf.min.js \
            && curl -fsSL "$P/pdf.worker.min.js" -o www/lib/pdf.worker.min.js \
            && curl -fsSL "$M/mammoth.browser.min.js" -o www/lib/mammoth.browser.min.js; then
            sed -i \
              -e "s#$P/pdf.min.js#lib/pdf.min.js#g" \
              -e "s#$P/pdf.worker.min.js#lib/pdf.worker.min.js#g" \
              -e "s#$M/mammoth.browser.min.js#lib/mammoth.browser.min.js#g" \
              www/index.html
            echo "Libraries bundled for offline use"
          else
            echo "Could not download libraries; keeping CDN links"
          fi

      - name: Create Android project
        run: |
          mkdir -p assets && cp icon-*.png assets/
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set version (always increases so it installs over the old one)
        run: |
          N=${{ github.run_number }}
          F=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.$N\"/" "$F"
          grep -E "versionCode|versionName" "$F"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign with the permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out RecallMan.apk aligned.apk
          "$BT/apksigner" verify --print-certs RecallMan.apk | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" RecallMan.apk \
            --title "RecallMan v${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} from commit ${GITHUB_SHA::7}"
